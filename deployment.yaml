apiVersion: apps/v1
kind: Deployment
metadata:
  name: ewaste-portal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ewaste-portal
  template:
    metadata:
      labels:
        app: ewaste-portal
    spec:
      containers:
      - name: ewaste-portal
        image: blackwolf82007/kavin-ewaste-portal:v1
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ewaste-portal-service
spec:
  type: NodePort
  selector:
    app: ewaste-portal
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080